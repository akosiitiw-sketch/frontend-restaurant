services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-restaurant_pos}
      MYSQL_USER: ${DB_USER:-pos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_this_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-pos_user}:${DB_PASSWORD:-change_this_password}@db:3306/${DB_NAME:-restaurant_pos}?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret-before-deployment}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}
      TAX_RATE: ${TAX_RATE:-0.12}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  mysql_data:
